services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter-local
      POSTGRES_DB: starter
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starter -d starter']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - starter-postgres:/var/lib/postgresql/data

volumes:
  starter-postgres:
